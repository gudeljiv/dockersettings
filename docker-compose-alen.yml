services:
    mariadb10:
        container_name: mariadb10
        image: mariadb:10.8.3
        restart: 'always'
        networks:
            - backend
        ports:
            - '3306:3306'
        volumes:
            - ./data/mysql:/var/lib/mysql
            - ./logs/mysql:/var/log/mysql
            - ./config/mysql:/etc/mysql
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        environment:
            MYSQL_ROOT_HOST: 'localhost'
            MYSQL_ROOT_PASSWORD: borming
            MARIADB_AUTO_UPGRADE: 1

    postgres14:
        container_name: postgres14
        image: postgres:14.1
        restart: always
        environment:
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=borming
        ports:
            - '5432:5432'
        volumes:
            - ./config/postgresql_14.1:/var/lib/postgresql/data
            - ./data/postgresql_14.1:/usr/local/share/postgresql
        networks:
            - backend

    postgres17:
        container_name: postgres17
        image: postgres:17.4
        restart: always
        environment:
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=borming
        ports:
            - '5433:5432'
        volumes:
            - ./config/postgresql_17.4:/var/lib/postgresql/data
            - ./data/postgresql_17.4:/usr/local/share/postgresql
        networks:
            - backend

networks:
    backend:
